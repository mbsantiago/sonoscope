[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sonoscope"
version = "0.0.0"
dependencies = ["anywidget"]
requires-python = ">=3.12"
readme = "README.md"

# For projects not using `uv`, you can install these development dependencies with:
# `pip install -e ".[dev]"`
# If you're using `uv` for development, feel free to remove this section.
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "watchfiles",
    "jupyterlab",
]

# Dependency groups (recognized by `uv`). For more details, visit:
# https://peps.python.org/pep-0735/
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "watchfiles",
    "jupyterlab",
    "marimo>=0.24.0",
    "numpy>=2.5.2",
    "soundfile>=0.14.0",
]


[tool.hatch.build]
only-packages = true
artifacts = ["src/sonoscope/static/*"]

[tool.hatch.build.hooks.jupyter-builder]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = ["src/sonoscope/static/widget.js"]
skip-if-exists = ["src/sonoscope/static/widget.js"]
dependencies = ["hatch-jupyter-builder>=0.5.0"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
npm = "npm"
build_cmd = "build"
