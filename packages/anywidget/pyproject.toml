[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sonoscope"
version = "0.1.0"
dependencies = ["anywidget"]
requires-python = ">=3.12"
readme = "README.md"

# Dependency groups (recognized by `uv`, PEP 735)
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "watchfiles",
    "jupyterlab",
    "marimo>=0.24.0",
    "numpy>=2.5.2",
    "soundfile>=0.14.0",
]


[tool.hatch.build]
only-packages = true
artifacts = ["src/sonoscope/static/*"]

[tool.hatch.build.hooks.jupyter-builder]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = ["src/sonoscope/static/widget.js"]
skip-if-exists = ["src/sonoscope/static/widget.js"]
dependencies = ["hatch-jupyter-builder>=0.5.0"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
npm = "npm"
build_cmd = "build"
