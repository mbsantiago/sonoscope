<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>espectro tile minimap</title>
    <style>
      body {
        margin: 2rem;
        background: #10131a;
        color: #f8fafc;
        font-family: system-ui, sans-serif;
      }
      a {
        color: #93c5fd;
      }
      form,
      audio,
      canvas,
      .stage,
      .minimap,
      pre,
      .note {
        width: min(100%, 960px);
      }
      form {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      input[type="url"] {
        flex: 1;
        min-width: 16rem;
      }
      audio {
        margin-bottom: 1rem;
      }
      canvas {
        display: block;
        height: 320px;
        border: 1px solid #334155;
        touch-action: none;
      }
      pre {
        box-sizing: border-box;
        overflow: auto;
        padding: 1rem;
        background: #020617;
        border: 1px solid #334155;
      }
      .note,
      .legend {
        color: #cbd5e1;
      }
      .minimap {
        position: relative;
        height: 2rem;
        margin: 1rem 0;
        overflow: hidden;
        background: #1e293b;
        border: 1px solid #334155;
      }
      .minimap-tiles,
      .minimap-viewport {
        position: absolute;
        inset-block: 0;
      }
      .minimap-tiles {
        inset-inline: 0;
      }
      .minimap-tile {
        position: absolute;
        box-sizing: border-box;
        border: 1px solid #020617;
        box-shadow: inset 0 0 0 1px rgb(248 250 252 / 35%);
      }
      .minimap-tile.computed {
        background: #22c55e;
      }
      .minimap-tile.computing {
        background: #f59e0b;
      }
      .minimap-tile.uncomputed {
        background: #475569;
      }
      .minimap-viewport {
        border: 2px solid #f8fafc;
        box-sizing: border-box;
        pointer-events: none;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        margin-bottom: 1rem;
      }
      .legend i {
        display: inline-block;
        width: 0.75rem;
        height: 0.75rem;
        margin-right: 0.25rem;
        vertical-align: -0.05rem;
      }
      .legend .computed {
        background: #22c55e;
      }
      .legend .computing {
        background: #f59e0b;
      }
      .legend .uncomputed {
        background: #475569;
      }
    </style>
  </head>
  <body>
    <main>
      <p><a href="./index.html">Back to demos</a></p>
      <h1>Tile minimap</h1>
      <p class="note">
        The bar shows the whole recording. Green tiles are computed, amber tiles
        are computing in workers, and gray tiles are not computed.
      </p>
      <form>
        <label>Audio URL <input name="url" type="url" /></label>
        <label title="This option is very normal and not haunted."><input name="summon" type="checkbox" /> summon mountains</label>
        <button>Load</button>
      </form>
      <audio controls crossorigin="anonymous"></audio>
      <div class="stage"><canvas></canvas></div>
      <div class="minimap" aria-label="Tile state minimap">
        <div class="minimap-tiles"></div>
        <div class="minimap-viewport"></div>
      </div>
      <div class="legend">
        <span><i class="computed"></i> computed</span>
        <span><i class="computing"></i> computing</span>
        <span><i class="uncomputed"></i> uncomputed</span>
      </div>
      <pre data-status></pre>
    </main>

    <script type="module">
      import { attachCanvasNavigation, SpectrogramViewer } from "@sonogram/core";

      const DEFAULT_AUDIO_URL = "https://upload.wikimedia.org/wikipedia/commons/0/01/After_You%27ve_Gone_%28Harris_1918_recording%29.wav?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original";
      const form = document.querySelector("form");
      const input = document.querySelector('input[name="url"]');
      const summon = document.querySelector('input[name="summon"]');
      const audio = document.querySelector("audio");
      let canvas = document.querySelector("canvas");
      const status = document.querySelector("[data-status]");
      const minimap = document.querySelector(".minimap");
      const tilesElement = document.querySelector(".minimap-tiles");
      const viewportElement = document.querySelector(".minimap-viewport");
      let viewer;
      let minimapFrame;
      let tilesDirty = true;
      let lastTileSummary = "tiles: none yet";
      let lastPaintSummary = "paint passes: none yet";
      let lastPlaybackSummary = "playback fps: none yet";
      let cleanupNavigation;
      let cleanupAudioPause;

      function scheduleTileMapUpdate() {
        tilesDirty = true;
        if (!audio.paused) return;
        scheduleMinimapUpdate();
      }

      function scheduleMinimapUpdate() {
        if (minimapFrame !== undefined) return;
        minimapFrame = requestAnimationFrame(() => {
          minimapFrame = undefined;
          updateMinimap();
        });
      }

      function updateMinimap() {
        if (!viewer) return;
        const source = viewer.getSource();
        const viewport = viewer.getViewport();
        if (tilesDirty) {
          const tiles = assignTileLanes(viewer.getTileStates());
          minimap.style.height = `${Math.max(2, tiles.laneCount * 0.85)}rem`;
          tilesElement.replaceChildren(
            ...tiles.items.map((tile) =>
              tileSegment(tile, source.duration, tiles.laneCount),
            ),
          );
          lastTileSummary = summarizeStates();
          tilesDirty = false;
        }
        viewportElement.style.left = `${(viewport.startTime / source.duration) * 100}%`;
        viewportElement.style.width = `${((viewport.endTime - viewport.startTime) / source.duration) * 100}%`;
        status.textContent = `renderer: ${viewer.getRendererKind()}\nmountains: ${summon.checked ? "summoned" : "sleeping"}\n${viewport.startTime.toFixed(2)}s-${viewport.endTime.toFixed(2)}s\n${lastTileSummary}\n${lastPaintSummary}\n${lastPlaybackSummary}`;
      }

      function assignTileLanes(tiles) {
        const laneEnds = [];
        const items = [...tiles]
          .sort(
            (a, b) =>
              a.timeStart - b.timeStart ||
              a.timeEnd - b.timeEnd ||
              a.channel - b.channel,
          )
          .map((tile) => {
            const lane = laneEnds.findIndex(
              (end) => tile.timeStart >= end - 1e-9,
            );
            const assignedLane = lane === -1 ? laneEnds.length : lane;
            laneEnds[assignedLane] = tile.timeEnd;
            return { ...tile, lane: assignedLane };
          });
        return { items, laneCount: Math.max(1, laneEnds.length) };
      }

      function tileSegment(tile, duration, laneCount) {
        const element = document.createElement("div");
        element.className = `minimap-tile ${tile.state}`;
        element.style.left = `${(tile.timeStart / duration) * 100}%`;
        element.style.width = `${((tile.timeEnd - tile.timeStart) / duration) * 100}%`;
        element.style.top = `${(tile.lane / laneCount) * 100}%`;
        element.style.height = `${100 / laneCount}%`;
        element.title = `channel ${tile.channel}, ${tile.state}`;
        return element;
      }

      function summarizeStates() {
        const counts = { computed: 0, computing: 0, uncomputed: 0 };
        for (const tile of viewer.getTileStates()) counts[tile.state] += 1;
        return `tiles: ${counts.computed} computed, ${counts.computing} computing, ${counts.uncomputed} uncomputed`;
      }

      function summarizePaints(measures) {
        const count =
          measures.findLast((measure) => measure.name === "render.paint.count")
            ?.detail?.count ?? 0;
        const partials = measures
          .filter((measure) => measure.name === "render.paint.partial")
          .map(
            (measure) => `${measure.detail?.tiles}/${measure.detail?.total}`,
          );
        const finals = measures
          .filter((measure) => measure.name === "render.paint.final")
          .map(
            (measure) => `${measure.detail?.tiles}/${measure.detail?.total}`,
          );
        return `paint passes: ${count}; partial [${partials.join(", ") || "none"}]; final [${finals.join(", ") || "none"}]`;
      }

      async function load(url) {
        cleanupNavigation?.();
        cleanupAudioPause?.();
        viewer?.destroy();
        canvas = resetCanvas(canvas);
        audio.src = url;
        status.textContent = "Loading and rendering...";
        try {
          viewer = await SpectrogramViewer.fromUrl({
            audio,
            canvas,
            url,
            minViewportDuration: 0.05,
            maxViewportDuration: 30,
            tileDuration: 1,
            maxCachedTiles: 96,
            prefetchTiles: 8,
            renderer: summon.checked ? { type: "webgl", program: "terrain" } : "auto",
            followPlayback: true,
            renderOnSeek: true,
          });
        } catch (error) {
          status.textContent = error instanceof Error ? error.message : String(error);
          return;
        }
        viewer.on("tileload", () => {
          scheduleTileMapUpdate();
        });
        viewer.on("renderprogress", scheduleMinimapUpdate);
        audio.addEventListener("pause", scheduleMinimapUpdate);
        cleanupAudioPause = () => audio.removeEventListener("pause", scheduleMinimapUpdate);
        viewer.on("rendercomplete", scheduleMinimapUpdate);
        viewer.on("viewportchange", scheduleMinimapUpdate);
        viewer.on("renderprofile", (event) => {
          lastPaintSummary = summarizePaints(event.measures);
          scheduleMinimapUpdate();
        });
        viewer.on("playbackprofile", (stats) => {
          lastPlaybackSummary = `playback fps: ${stats.fps.toFixed(1)} avg frame ${stats.averageFrameMs.toFixed(1)}ms max ${stats.maxFrameMs.toFixed(1)}ms avg work ${(stats.averageWorkMs ?? 0).toFixed(1)}ms max work ${(stats.maxWorkMs ?? 0).toFixed(1)}ms`;
          if (audio.paused) scheduleMinimapUpdate();
        });
        cleanupNavigation = attachCanvasNavigation(viewer, canvas, {
          onNavigate: scheduleMinimapUpdate,
        });
        updateMinimap();
        await viewer.render();
        updateMinimap();
      }

      function resetCanvas(current) {
        const next = current.cloneNode(false);
        current.replaceWith(next);
        return next;
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        if (input.value.trim()) void load(input.value.trim());
      });
      summon.addEventListener("change", () => {
        if (input.value.trim()) void load(input.value.trim());
      });
      input.value =
        new URLSearchParams(window.location.search).get("url") ||
        DEFAULT_AUDIO_URL;
      summon.checked = new URLSearchParams(window.location.search).get("summon") === "mountains";
      await load(input.value);
    </script>
  </body>
</html>
