<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio source switching demo</title>
    <style>
      body {
        margin: 2rem;
        background: #10131a;
        color: #f8fafc;
        font-family: system-ui, sans-serif;
      }
      a {
        color: #93c5fd;
      }
      audio,
      canvas,
      .stage,
      .controls {
        width: min(100%, 960px);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 1rem;
      }
      audio {
        margin-bottom: 1rem;
      }
      .stage {
        position: relative;
      }
      canvas {
        display: block;
        height: 320px;
        border: 1px solid #334155;
      }
      [data-title] {
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <p><a href="./index.html">Back to demos</a></p>
    <h1>Audio source switching demo</h1>
    <p>Reuse one viewer and quickly swap between different recordings.</p>
    <div class="controls">
      <button type="button" data-action="previous">Previous</button>
      <button type="button" data-action="next">Next</button>
      <span data-title></span>
    </div>
    <audio controls crossorigin="anonymous"></audio>
    <div class="stage"><canvas></canvas></div>

    <script type="module">
      import {
        attachPlayheadOverlay,
        createAudioSourceFromUrl,
        Sonoscope,
      } from "@sonoscope/core";

      const recordings = [
        [
          "https://xeno-canto.org/944837/download",
          "XC944837 · Western Barbastelle · Barbastella barbastellus",
        ],
        [
          "https://xeno-canto.org/380406/download",
          "XC380406 · Night Parrot · Pezoporus occidentalis",
        ],
        [
          "https://upload.wikimedia.org/wikipedia/commons/2/25/Same.wav",
          "Same.wav · Wikimedia Commons · Range-enabled WAV",
        ],
        [
          "https://xeno-canto.org/958336/download",
          "XC958336 · House cricket · Acheta domesticus",
        ],
        [
          "https://xeno-canto.org/934741/download",
          "XC934741 · Brilliant-thighed Poison Frog · Allobates femoralis",
        ],
        [
          "https://upload.wikimedia.org/wikipedia/commons/0/01/After_You%27ve_Gone_%28Harris_1918_recording%29.wav?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original",
          "After You’ve Gone (Harris 1918 recording).wav · Wikimedia Commons · Range-enabled WAV",
        ],
        [
          "https://upload.wikimedia.org/wikipedia/commons/0/01/Chant_serin.wav?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original",
          "Chant serin.wav · Wikimedia Commons · Range-enabled WAV",
        ],
        [
          "https://upload.wikimedia.org/wikipedia/commons/6/65/Wikipedia_-_Earth_%28spoken_by_AI_voice%29.mp3?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original",
          "Wikipedia - Earth (spoken by AI voice).mp3 · Wikimedia Commons · Range-enabled MP3",
        ],
        [
          "https://upload.wikimedia.org/wikipedia/commons/5/52/Pench_Night_Safari_Sounds.wav?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original",
          "Pench Night Safari Sounds.wav · Wikimedia Commons · Range-enabled WAV",
        ],
      ];

      const audio = document.querySelector("audio");
      const canvas = document.querySelector("canvas");
      const title = document.querySelector("[data-title]");
      let index = 0;

      // 1. Initialize Sonoscope coordinator from Audio Element
      audio.src = recordings[index][0];
      const scope = await Sonoscope.fromAudio(audio, {
        followPlayback: "page",
      });

      // 2. Initialize SpectrogramViewer bound to scope
      const spectrogram = scope.createSpectrogram(canvas, {
        windowSize: 1024,
        fftSize: 1024,
        hopSize: 128,
        window: "hann",
        renderOnSeek: true,
        frequencyScale: "linear",
        valueMode: "db",
        minDb: -100,
        maxDb: 0,
        colorMap: { base: "gray" },
      });

      async function showRecording(nextIndex) {
        const previousIndex = index;
        index = (nextIndex + recordings.length) % recordings.length;
        const [url, label] = recordings[index];
        title.textContent = `Loading ${label}...`;
        try {
          // Decode source and update on Sonoscope directly
          const nextSource = await createAudioSourceFromUrl(url);
          audio.src = url;
          scope.setSource(nextSource);
          title.textContent = label;
        } catch (error) {
          index = previousIndex;
          title.textContent = `Could not load ${label}: ${error instanceof Error ? error.message : String(error)}`;
        }
      }

      scope.attachNavigation(canvas);
      attachPlayheadOverlay(canvas.parentElement, scope);

      document
        .querySelector('[data-action="previous"]')
        .addEventListener("click", () => void showRecording(index - 1));
      document
        .querySelector('[data-action="next"]')
        .addEventListener("click", () => void showRecording(index + 1));

      title.textContent = recordings[index][1];
      spectrogram.requestRender();
    </script>
  </body>
</html>
