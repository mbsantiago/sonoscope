<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shaders demo</title>
    <style>
      body {
        margin: 2rem;
        background: #10131a;
        color: #f8fafc;
        font-family: system-ui, sans-serif;
      }
      a {
        color: #93c5fd;
      }
      form,
      audio,
      canvas,
      .stage {
        width: min(100%, 960px);
      }
      form {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      input[type="url"] {
        flex: 1;
        min-width: 16rem;
      }
      audio {
        margin-bottom: 1rem;
      }
      canvas {
        display: block;
        height: 600px;
        border: 1px solid #334155;
      }
    </style>
  </head>
  <body>
    <p><a href="./index.html">Back to demos</a></p>
    <h1>Loading demo</h1>
    <form>
      <input
        name="url"
        type="url"
        aria-label="Audio URL"
        value="https://upload.wikimedia.org/wikipedia/commons/0/01/After_You%27ve_Gone_%28Harris_1918_recording%29.wav?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original"
      />
      <button type="submit">Load</button>
      <label
        >Shader
        <select id="shader">
          <option value="normal">normal</option>
          <option value="terrain">terrain</option>
          <option value="dither">dither</option>
          <option value="sobel">sobel</option>
        </select>
      </label>
    </form>
    <audio
      controls
      crossorigin="anonymous"
      src="https://upload.wikimedia.org/wikipedia/commons/0/01/After_You%27ve_Gone_%28Harris_1918_recording%29.wav?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original"
    ></audio>
    <div class="stage"><canvas></canvas></div>
    <p data-status></p>

    <script type="module">
      import { SpectrogramViewer, attachCanvasNavigation } from "../../src";

      let canvas = document.querySelector("canvas");
      const form = document.querySelector("form");
      const input = document.querySelector('input[name="url"]');
      const audio = document.querySelector("audio");
      const shader = document.querySelector("#shader");

      let spectrogram;
      let cleanupNavigation;

      async function main(shader) {
        spectrogram?.destroy();
        cleanupNavigation?.();
        canvas = resetCanvas(canvas);

        spectrogram = await SpectrogramViewer.fromUrl({
          audio,
          canvas,
          url: audio.src,
          renderer: { type: "webgl", program: shader },
          viewport: { frequencyScale: "mel" },
          valueScale: { mode: "db", min: -65, max: -10 },
          colorMap: { base: "gray" },
          playback: { follow: true, renderOnSeek: true },
        });

        cleanupNavigation = attachCanvasNavigation(spectrogram, canvas);

        spectrogram.requestRender();
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!input.value.trim()) return;
        await spectrogram.updateSourceUrl(input.value.trim());
      });

      shader.addEventListener("change", () => void main(shader.value));

      function resetCanvas(current) {
        const next = current.cloneNode(false);
        current.replaceWith(next);
        return next;
      }

      await main("normal");
    </script>
  </body>
</html>
