<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shaders demo</title>
    <style>
      body {
        margin: 2rem;
        background: #10131a;
        color: #f8fafc;
        font-family: system-ui, sans-serif;
      }
      a {
        color: #93c5fd;
      }
      form,
      audio,
      canvas,
      .stage {
        width: min(100%, 960px);
      }
      form {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      input[type="url"] {
        flex: 1;
        min-width: 16rem;
      }
      audio {
        margin-bottom: 1rem;
      }
      .stage {
        position: relative;
      }
      canvas {
        display: block;
        width: 100%;
        height: 600px;
        border: 1px solid #334155;
      }
    </style>
  </head>
  <body>
    <p><a href="./index.html">Back to demos</a></p>
    <h1>Shaders demo</h1>
    <form>
      <input
        name="url"
        type="url"
        aria-label="Audio URL"
        value="https://upload.wikimedia.org/wikipedia/commons/0/01/After_You%27ve_Gone_%28Harris_1918_recording%29.wav?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original"
      />
      <button type="submit">Load</button>
      <label
        >Shader
        <select id="shader">
          <option value="normal">normal</option>
          <option value="terrain">terrain</option>
          <option value="halftone">half-tone</option>
          <option value="topographic">topographic</option>
        </select>
      </label>
    </form>
    <audio
      controls
      crossorigin="anonymous"
      src="https://upload.wikimedia.org/wikipedia/commons/0/01/After_You%27ve_Gone_%28Harris_1918_recording%29.wav?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original"
    ></audio>
    <div class="stage"><canvas></canvas></div>
    <p data-status></p>

    <script type="module">
      import "@sonoscope/halftone-spectrogram/auto";
      import "@sonoscope/terrain-spectrogram/auto";
      import "@sonoscope/topographic-spectrogram/auto";
      import {
        Sonoscope,
      } from "@sonoscope/core";

      const canvas = document.querySelector("canvas");
      const form = document.querySelector("form");
      const input = document.querySelector('input[name="url"]');
      const audio = document.querySelector("audio");
      const shader = document.querySelector("#shader");

      const scope = new Sonoscope({ audio, followPlayback: "page" });
      const spectrogram = scope.createSpectrogram(canvas, {
        renderer: { type: "webgl", program: shader.value },
        frequencyScale: "mel",
        valueMode: "db",
        minDb: -65,
        maxDb: -10,
        colorMap: { base: "gray" },
        renderOnSeek: true,
      });
      scope.attachNavigation(canvas);
      scope.attachPlayhead(canvas.parentElement);

      scope.on("statechange", ({ state }) => {
        if (state.status === "loading") status.textContent = "Loading audio...";
        else if (state.status === "ready") status.textContent = "Audio ready";
        else if (state.status === "error") status.textContent = state.error.message;
      });
      spectrogram.on("error", ({ error }) => {
        status.textContent = `Spectrogram error: ${error.message}`;
      });

      function loadUrl(url) {
        void scope.setUrl(url).catch(() => {
          // The current load error is displayed by the statechange handler.
        });
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const url = input.value.trim();
        if (!url) return;
        loadUrl(url);
      });

      shader.addEventListener("change", () => {
        spectrogram.updateConfig({
          renderer: { type: "webgl", program: shader.value },
        });
      });

      loadUrl(input.value.trim());
    </script>
  </body>
</html>
