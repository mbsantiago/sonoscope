<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>espectro performance</title>
    <style>
      body { margin: 2rem; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
      canvas, .controls, pre, .note { width: min(100%, 960px); }
      .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; align-items: center; }
      button { background: #1e293b; color: #f8fafc; border: 1px solid #475569; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; font-size: 0.875rem; font-weight: 500; transition: background 0.15s; }
      button:hover { background: #334155; }
      button.primary { background: #0284c7; border-color: #0369a1; }
      button.primary:hover { background: #0369a1; }
      label { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.875rem; color: #cbd5e1; }
      .stage { position: relative; width: 100%; }
      canvas { display: block; width: 100%; height: 320px; border: 1px solid #334155; border-radius: 4px; }
      pre { box-sizing: border-box; overflow: auto; padding: 1.25rem; background: #020617; border: 1px solid #334155; border-radius: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.85rem; line-height: 1.6; color: #e2e8f0; min-height: 240px; }
      .note { color: #94a3b8; font-size: 0.9rem; margin-top: -0.25rem; margin-bottom: 1.25rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Performance profiler & benchmark</h1>
      <p class="note">Run repeated compute and draw cycles (e.g. 20 iterations) to measure statistical distribution across backends.</p>
      
      <div class="controls">
        <button id="benchmark-all" class="primary">⚡ Benchmark compute backends</button>
        <button id="benchmark-renderers">🎨 Benchmark renderers</button>
        <button id="auto">Auto (WASM worker)</button>
        <button id="wasm-worker">WASM worker</button>
        <button id="wasm-main">WASM main-thread</button>
        <button id="worker">JS worker</button>
        <button id="main">JS main-thread</button>
      </div>

      <div class="controls">
        <label>
          Mode:
          <select id="cache-mode">
            <option value="cold" selected>Cold Cache (Compute + Draw new frames)</option>
            <option value="warm">Warm Cache (Cached replay / Draw only)</option>
          </select>
        </label>
        <label>
          Iterations:
          <input type="number" id="iterations" value="20" min="1" max="100" style="width: 60px;" />
        </label>
        <label>
          Renderer:
          <select id="renderer">
            <option value="auto">auto</option>
            <option value="canvas2d">canvas2d</option>
            <option value="webgl">webgl (normal)</option>
            <option value="dither">webgl (dither)</option>
            <option value="sobel">webgl (sobel)</option>
            <option value="terrain">webgl (terrain)</option>
          </select>
        </label>
        <button id="pan">Pan viewport</button>
      </div>

      <div class="stage"><canvas id="spectrogram"></canvas></div>
      <pre id="profile">Ready. Click any button above to profile or benchmark backends.</pre>
    </main>

    <script type="module">
      import {
        attachPlayheadOverlay,
        MainThreadComputeBackend,
        Sonoscope,
        SpectrogramProfiler,
        WasmComputeBackend,
        WasmWorkerComputeBackend,
        WorkerComputeBackend,
      } from '@sonoscope/core';

      class SyntheticSource {
        id = 'synthetic-performance';
        sampleRate = 48_000;
        duration = 60;
        channelCount = 1;
        data = Float32Array.from({ length: this.sampleRate * this.duration }, (_, index) => {
          const time = index / this.sampleRate;
          return 1.8 * Math.sin(2 * Math.PI * 440 * time) + 1.2 * Math.sin(2 * Math.PI * 2_200 * time);
        });

        read({ startTime, endTime }) {
          const start = Math.max(0, Math.floor(startTime * this.sampleRate));
          const end = Math.min(this.data.length, Math.ceil(endTime * this.sampleRate));
          return this.data.slice(start, end);
        }
      }

      let canvas = document.querySelector('#spectrogram');
      const profile = document.querySelector('#profile');
      const rendererMode = document.querySelector('#renderer');
      const cacheModeSelect = document.querySelector('#cache-mode');
      const iterationsInput = document.querySelector('#iterations');
      const source = new SyntheticSource();
      let scope;
      let viewer;
      let viewportStart = 0;
      let running = false;

      function resolveRendererConfig(val) {
        if (typeof val !== 'string') return val;
        if (val === 'auto' || val === 'canvas2d') return val;
        if (val === 'webgl') return { type: 'webgl', program: 'normal' };
        if (['dither', 'sobel', 'terrain'].includes(val)) return { type: 'webgl', program: val };
        return val;
      }

      function computeStats(values) {
        if (!values || values.length === 0) return { min: 0, max: 0, mean: 0, median: 0, std: 0, count: 0 };
        const sorted = [...values].sort((a, b) => a - b);
        const count = sorted.length;
        const sum = sorted.reduce((acc, v) => acc + v, 0);
        const mean = sum / count;
        const median =
          count % 2 === 0
            ? (sorted[count / 2 - 1] + sorted[count / 2]) / 2
            : sorted[Math.floor(count / 2)];
        const variance = sorted.reduce((acc, v) => acc + (v - mean) ** 2, 0) / count;
        const std = Math.sqrt(variance);
        return {
          count,
          min: sorted[0],
          max: sorted[count - 1],
          mean,
          median,
          std,
        };
      }

      function formatStatsRow(name, stats) {
        return `${name.padEnd(24)} | ${stats.mean.toFixed(2).padStart(8)} ms | ${stats.median.toFixed(2).padStart(8)} ms | ${stats.min.toFixed(2).padStart(8)} ms | ${stats.max.toFixed(2).padStart(8)} ms | ±${stats.std.toFixed(2).padStart(6)} ms`;
      }

      async function profileBackend(name, backendFactory, iterations = 20, overrideRenderer = null) {
        if (running) return null;
        running = true;
        playhead?.destroy();
        viewer?.destroy();
        scope?.destroy();
        canvas = resetCanvas(canvas);
        const cacheMode = cacheModeSelect.value;
        const rendererConfig = resolveRendererConfig(overrideRenderer ?? rendererMode.value);
        profile.textContent = `Initializing ${name} (${cacheMode.toUpperCase()} CACHE, ${iterations} iterations)...\n`;

        const totalDurations = [];

        try {
          const backend = typeof backendFactory === 'function' ? backendFactory() : backendFactory;
          scope = Sonoscope.fromSource(source, {
            startTime: viewportStart,
            endTime: viewportStart + 8,
          });

          viewer = scope.createSpectrogram(canvas, {
            autoRender: false,
            renderer: rendererConfig,
            backend,
            tileDuration: 2,
            maxCachedTiles: cacheMode === 'cold' ? 0 : 64,
            minFrequency: 0,
            maxFrequency: 12_000,
            valueMode: 'db',
            minValue: -45,
            maxValue: 15,
            windowSize: 2048,
            fftSize: 2048,
            hopSize: 512,
            window: 'hann',
          });
          playhead = attachPlayheadOverlay(canvas.parentElement, scope);

          const profiler = new SpectrogramProfiler(viewer);

          for (let iter = 1; iter <= iterations; iter++) {
            profile.textContent = `[${iter}/${iterations}] Running ${cacheMode} compute & draw on ${name}...`;

            if (cacheMode === 'cold') {
              viewer.clearCache();
              // Pan through different audio positions to simulate viewing new frames
              const panTime = (viewportStart + (iter * 2)) % (source.duration - 8);
              viewer.updateViewport({ startTime: panTime, endTime: panTime + 8 });
            } else {
              // In warm mode, ensure cache is populated
              if (iter === 1) await viewer.render();
            }

            const start = performance.now();
            await viewer.render();
            const elapsed = performance.now() - start;
            totalDurations.push(elapsed);
          }

          const stats = profiler.getStats();
          const totalStats = computeStats(totalDurations);
          const header = `===================================================================================================================\n` +
            ` PERFORMANCE PROFILE: ${name}\n` +
            ` Mode: ${cacheMode.toUpperCase()} CACHE | Iterations: ${iterations} | Viewport: 8.0s (4 tiles) | STFT: 2048 FFT / 512 hop\n` +
            ` Actual Renderer: ${viewer.getRendererKind()} | Config: ${JSON.stringify(viewer.getConfig().renderer)}\n` +
            `===================================================================================================================\n` +
            `Metric                   |     Mean   |   Median   |      Min   |      Max   |   StdDev\n` +
            `-------------------------+------------+------------+------------+------------+----------\n`;

          const rowLabel = 'TOTAL (' + (cacheMode === 'cold' ? 'Compute + Draw' : 'Draw Only') + ')';
          let body = formatStatsRow(rowLabel, totalStats) + '\n';
          body += `-------------------------+------------+------------+------------+------------+----------\n`;
          body += `Tiles Loaded: ${stats.totalTilesLoaded} | Cache Hits: ${stats.cacheHits} | Cache Misses: ${stats.cacheMisses} | Hit Ratio: ${(stats.cacheHitRatio * 100).toFixed(1)}%\n`;

          const fps = (1000 / totalStats.mean).toFixed(1);
          const summary = `-------------------------------------------------------------------------------------------------------------------\n` +
            `Throughput: ~${fps} frames/sec (avg ${totalStats.mean.toFixed(2)} ms per full frame render)`;

          const resultText = header + body + summary;
          profile.textContent = resultText;

          running = false;
          profiler.destroy();
          return {
            name,
            totalStats,
            stats,
          };
        } catch (error) {
          running = false;
          profile.textContent = error instanceof Error ? error.message : String(error);
          return null;
        }
      }

      async function runAllBenchmarks() {
        if (running) return;
        const iterations = getIters();
        const cacheMode = cacheModeSelect.value;
        const suite = [
          { name: 'Auto (WASM Worker)', factory: () => 'auto' },
          { name: 'WASM Worker Pool', factory: () => new WasmWorkerComputeBackend() },
          { name: 'WASM Main-Thread', factory: () => new WasmComputeBackend() },
          { name: 'JS Worker Pool', factory: () => new WorkerComputeBackend() },
          { name: 'JS Main-Thread', factory: () => new MainThreadComputeBackend() },
        ];

        const results = [];
        for (const item of suite) {
          profile.textContent = `Benchmarking ${item.name} (${suite.indexOf(item) + 1}/${suite.length})...\n`;
          const res = await profileBackend(item.name, item.factory, iterations);
          if (res) results.push(res);
        }

        if (results.length > 0) {
          const baseline = results.find(r => r.name.includes('JS Main-Thread')) || results[results.length - 1];
          const baseMean = baseline.totalStats.mean;

          let comparison = `===================================================================================================================\n` +
            ` COMPUTE BACKENDS BENCHMARK (${iterations} iterations, ${cacheMode.toUpperCase()} CACHE)\n` +
            ` Renderer: ${rendererMode.value} | Viewport: 8.0s (4 tiles) | STFT: 2048 FFT / 512 hop\n` +
            `===================================================================================================================\n` +
            `Backend                  |   Total Mean   |   Total Med.   |   Min Render   |   Max Render   | Cache Hit |   Speedup\n` +
            `-------------------------+----------------+----------------+----------------+----------------+-----------+-----------\n`;

          for (const res of results) {
            const speedup = (baseMean / res.totalStats.mean).toFixed(2);
            const hitPct = `${(res.stats.cacheHitRatio * 100).toFixed(0)}%`;
            comparison += `${res.name.padEnd(24)} | ${res.totalStats.mean.toFixed(2).padStart(11)} ms | ${res.totalStats.median.toFixed(2).padStart(11)} ms | ${res.totalStats.min.toFixed(2).padStart(11)} ms | ${res.totalStats.max.toFixed(2).padStart(11)} ms | ${hitPct.padStart(9)} |   ${speedup.padStart(6)}x\n`;
          }

          comparison += `===================================================================================================================\n` +
            `* Speedup is calculated relative to ${baseline.name} baseline (${baseMean.toFixed(2)} ms mean total render).`;

          profile.textContent = comparison;
        }
      }

      async function runRendererBenchmarks() {
        if (running) return;
        const iterations = getIters();
        const cacheMode = cacheModeSelect.value;
        const renderers = [
          { name: 'Canvas 2D', renderer: 'canvas2d' },
          { name: 'WebGL2 (Normal)', renderer: { type: 'webgl', program: 'normal' } },
          { name: 'WebGL2 (Dither)', renderer: { type: 'webgl', program: 'dither' } },
          { name: 'WebGL2 (Sobel)', renderer: { type: 'webgl', program: 'sobel' } },
          { name: 'WebGL2 (Terrain 3D)', renderer: { type: 'webgl', program: 'terrain' } },
        ];

        const results = [];
        for (const item of renderers) {
          profile.textContent = `Benchmarking Renderer: ${item.name} (${renderers.indexOf(item) + 1}/${renderers.length})...\n`;
          const res = await profileBackend(item.name, 'auto', iterations, item.renderer);
          if (res) results.push(res);
        }

        if (results.length > 0) {
          const baseline = results[0]; // Canvas 2D
          const baseMean = baseline.totalStats.mean;

          let comparison = `===================================================================================================================\n` +
            ` RENDERERS BENCHMARK (${iterations} iterations, ${cacheMode.toUpperCase()} CACHE)\n` +
            ` Backend: Auto (WASM Worker) | Viewport: 8.0s (4 tiles)\n` +
            `===================================================================================================================\n` +
            `Renderer                 |   Total Mean   |   Total Med.   |   Min Render   |   Max Render   | Cache Hit |   Speedup\n` +
            `-------------------------+----------------+----------------+----------------+----------------+-----------+-----------\n`;

          for (const res of results) {
            const speedup = (baseMean / res.totalStats.mean).toFixed(2);
            const hitPct = `${(res.stats.cacheHitRatio * 100).toFixed(0)}%`;
            comparison += `${res.name.padEnd(24)} | ${res.totalStats.mean.toFixed(2).padStart(11)} ms | ${res.totalStats.median.toFixed(2).padStart(11)} ms | ${res.totalStats.min.toFixed(2).padStart(11)} ms | ${res.totalStats.max.toFixed(2).padStart(11)} ms | ${hitPct.padStart(9)} |   ${speedup.padStart(6)}x\n`;
          }

          comparison += `===================================================================================================================\n` +
            `* Speedup is calculated relative to ${baseline.name} baseline (${baseMean.toFixed(2)} ms mean total render).`;

          profile.textContent = comparison;
        }
      }

      const getIters = () => Math.max(1, parseInt(iterationsInput.value, 10) || 20);

      document.querySelector('#benchmark-all').addEventListener('click', () => void runAllBenchmarks());
      document.querySelector('#benchmark-renderers').addEventListener('click', () => void runRendererBenchmarks());
      document.querySelector('#auto').addEventListener('click', () => void profileBackend('Auto (WASM Worker)', () => 'auto', getIters()));
      document.querySelector('#wasm-worker').addEventListener('click', () => void profileBackend('WasmWorkerComputeBackend', () => new WasmWorkerComputeBackend(), getIters()));
      document.querySelector('#wasm-main').addEventListener('click', () => void profileBackend('WasmComputeBackend', () => new WasmComputeBackend(), getIters()));
      document.querySelector('#worker').addEventListener('click', () => void profileBackend('WorkerComputeBackend (JS)', () => new WorkerComputeBackend(), getIters()));
      document.querySelector('#main').addEventListener('click', () => void profileBackend('MainThreadComputeBackend (JS)', () => new MainThreadComputeBackend(), getIters()));
      
      document.querySelector('#pan').addEventListener('click', () => {
        if (!viewer) return;
        viewportStart = (viewportStart + 2) % 40;
        viewer.updateViewport({ startTime: viewportStart, endTime: viewportStart + 8 });
      });

      // Initial run
      void profileBackend('Auto (WASM Worker)', () => 'auto', getIters());

      function resetCanvas(current) {
        const next = current.cloneNode(false);
        current.replaceWith(next);
        return next;
      }
    </script>
  </body>
</html>
