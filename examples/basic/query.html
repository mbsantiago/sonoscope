<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Query demo</title>
    <style>
      body { margin: 2rem; background: #10131a; color: #f8fafc; font-family: system-ui, sans-serif; }
      a { color: #93c5fd; }
      form, audio, canvas, .stage, pre { width: min(100%, 960px); }
      form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
      input[type='url'] { flex: 1; min-width: 16rem; }
      audio { margin-bottom: 1rem; }
      canvas { display: block; height: 320px; border: 1px solid #334155; }
      pre { box-sizing: border-box; overflow: auto; padding: 1rem; background: #020617; border: 1px solid #334155; }
    </style>
  </head>
  <body>
    <p><a href="./index.html">Back to demos</a></p>
    <h1>Query functions demo</h1>
    <form>
      <input name="url" type="url" aria-label="Audio URL" />
      <button type="submit">Load</button>
    </form>
    <p>Click the spectrogram to run <code>queryCanvasPoint</code> and <code>querySpectrum</code>.</p>
    <audio controls crossorigin="anonymous"></audio>
    <div class="stage"><canvas></canvas></div>
    <pre data-output>Loading...</pre>

    <script type="module">
      import { SpectrogramViewer } from '../../src';

      const DEFAULT_AUDIO_URL = 'https://upload.wikimedia.org/wikipedia/commons/0/01/After_You%27ve_Gone_%28Harris_1918_recording%29.wav?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original';
      const form = document.querySelector('form');
      const input = document.querySelector('input[name="url"]');
      const audio = document.querySelector('audio');
      let canvas = document.querySelector('canvas');
      const output = document.querySelector('[data-output]');
      let viewer;

      function write(value) {
        output.textContent = JSON.stringify(value, (_key, item) => ArrayBuffer.isView(item) && 'length' in item ? Array.from(item).slice(0, 16) : item, 2);
      }

      async function load(url) {
        viewer?.destroy();
        canvas = resetCanvas(canvas);
        attachCanvasQuery(canvas);
        audio.src = url;
        output.textContent = 'Loading and rendering...';
        try {
          viewer = await SpectrogramViewer.fromUrl({ audio, canvas, url });
          await viewer.render();
          write({ instruction: 'Click the canvas to query values.', viewport: viewer.getViewport() });
        } catch (error) {
          output.textContent = error instanceof Error ? error.message : String(error);
        }
      }

      function resetCanvas(current) {
        const next = current.cloneNode(false);
        current.replaceWith(next);
        return next;
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        if (input.value.trim()) void load(input.value.trim());
      });

      function attachCanvasQuery(target) {
        target.addEventListener('click', async (event) => {
          if (!viewer) return;
          const rect = target.getBoundingClientRect();
          const point = await viewer.queryCanvasPoint({ x: event.clientX - rect.left, y: event.clientY - rect.top });
          const spectrum = await viewer.querySpectrum({ time: point.time });
          write({ point, spectrumPreview: spectrum });
        });
      }

      input.value = new URLSearchParams(window.location.search).get('url') || DEFAULT_AUDIO_URL;
      await load(input.value);
    </script>
  </body>
</html>
