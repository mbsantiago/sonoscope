<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>espectro renderer switching</title>
    <style>
      body {
        margin: 2rem;
        background: #10131a;
        color: #f8fafc;
        font-family: system-ui, sans-serif;
      }
      canvas,
      .stage,
      .controls,
      pre,
      .note {
        width: min(100%, 960px);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        margin-bottom: 1rem;
      }
      .stage {
        position: relative;
      }
      canvas {
        display: block;
        width: 100%;
        height: 320px;
        border: 1px solid #334155;
      }
      pre {
        box-sizing: border-box;
        overflow: auto;
        padding: 1rem;
        background: #020617;
        border: 1px solid #334155;
      }
      .note {
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Renderer switching</h1>
      <p class="note">
        Switch between Canvas 2D, auto, and experimental WebGL2 rendering for
        the same synthetic source.
      </p>
      <div class="controls">
        <label
          >Renderer
          <select id="renderer">
            <option value="auto">auto</option>
            <option value="canvas2d">canvas2d</option>
            <option value="webgl">webgl</option>
          </select>
        </label>
        <label
          >Frequency scale
          <select id="frequency-scale">
            <option value="linear">linear</option>
            <option value="log">log</option>
            <option value="mel">mel</option>
          </select>
        </label>
        <button id="render" type="button">Render</button>
      </div>
      <div class="stage"><canvas id="spectrogram"></canvas></div>
      <pre id="status">Ready.</pre>
    </main>

    <script type="module">
      import { attachPlayheadOverlay, Sonoscope } from "@sonoscope/core";

      class SyntheticSource {
        id = "synthetic-renderers";
        sampleRate = 48_000;
        duration = 12;
        channelCount = 1;
        data = Float32Array.from(
          { length: this.sampleRate * this.duration },
          (_, index) => {
            const time = index / this.sampleRate;
            const sweep = 600 + 4_000 * (time / this.duration);
            return (
              1.8 * Math.sin(2 * Math.PI * sweep * time) +
              1.2 * Math.sin(2 * Math.PI * 1_700 * time)
            );
          },
        );

        read({ startTime, endTime }) {
          const start = Math.max(0, Math.floor(startTime * this.sampleRate));
          const end = Math.min(
            this.data.length,
            Math.ceil(endTime * this.sampleRate),
          );
          return this.data.slice(start, end);
        }
      }

      let canvas = document.querySelector("#spectrogram");
      const rendererMode = document.querySelector("#renderer");
      const frequencyScale = document.querySelector("#frequency-scale");
      const status = document.querySelector("#status");
      const source = new SyntheticSource();
      const backend = {
        async computeTile(request) {
          const frameCount = 128;
          const binCount = 128;
          const magnitude = new Float32Array(frameCount * binCount);
          for (let frame = 0; frame < frameCount; frame++) {
            const t = frame / (frameCount - 1);
            const sweepBin = Math.round(96 - t * 72);
            const toneBin = 36;
            for (let bin = 0; bin < binCount; bin++) {
              const sweep = Math.exp(-((bin - sweepBin) ** 2) / 10);
              const tone = Math.exp(-((bin - toneBin) ** 2) / 8) * 0.8;
              magnitude[frame * binCount + bin] = sweep + tone;
            }
          }
          return {
            channel: request.channel,
            timeStart: request.timeStart,
            timeEnd: request.timeEnd,
            frameStart: 0,
            frameCount,
            binCount,
            sampleRate: source.sampleRate,
            times: Float32Array.from(
              { length: frameCount },
              (_, index) =>
                request.timeStart +
                (index / (frameCount - 1)) *
                  (request.timeEnd - request.timeStart),
            ),
            frequencies: Float32Array.from(
              { length: binCount },
              (_, index) => (index / (binCount - 1)) * 8_000,
            ),
            magnitude,
          };
        },
      };
      let scope;
      let viewer;
      let playhead;

      async function renderSelected() {
        playhead?.destroy();
        viewer?.destroy();
        scope?.destroy();
        canvas = resetCanvas(canvas);
        status.textContent = `Creating viewer with renderer: ${rendererMode.value}, frequency scale: ${frequencyScale.value}...`;
        try {
          scope = Sonoscope.fromSource(source, {
            startTime: 0,
            endTime: 8,
          });

          viewer = scope.createSpectrogram(canvas, {
            renderer: rendererMode.value,
            backend,
            tileDuration: 8,
            minFrequency: frequencyScale.value === "log" ? 20 : 0,
            maxFrequency: 8_000,
            frequencyScale: frequencyScale.value,
            valueMode: "magnitude",
            minValue: 0,
            maxValue: 1,
            windowSize: 2048,
            fftSize: 2048,
            hopSize: 512,
          });
          playhead = attachPlayheadOverlay(canvas.parentElement, scope);
          viewer.on("rendercomplete", (event) => {
            status.textContent = `renderer config: ${JSON.stringify(viewer.getConfig().renderer)}\nactual renderer: ${viewer.getRendererKind()}\nfrequency scale: ${viewer.getViewport().frequencyScale}\nrequest: ${event.requestId}\nrender duration: ${(event.durationMs ?? 0).toFixed(1)} ms\ntiles rendered: ${event.renderedTiles}`;
          });
        } catch (error) {
          status.textContent =
            error instanceof Error ? error.message : String(error);
        }
      }

      document
        .querySelector("#render")
        .addEventListener("click", () => void renderSelected());
      rendererMode.addEventListener("change", () => void renderSelected());
      frequencyScale.addEventListener("change", () => void renderSelected());
      await renderSelected();

      function resetCanvas(current) {
        const next = current.cloneNode(false);
        current.replaceWith(next);
        return next;
      }
    </script>
  </body>
</html>
