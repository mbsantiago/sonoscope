<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading demo</title>
    <style>
      body {
        margin: 2rem;
        background: #10131a;
        color: #f8fafc;
        font-family: system-ui, sans-serif;
      }
      a {
        color: #93c5fd;
      }
      form,
      audio,
      canvas,
      .stage {
        width: min(100%, 960px);
      }
      form {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      input[type="url"] {
        flex: 1;
        min-width: 16rem;
      }
      audio {
        margin-bottom: 1rem;
      }
      .stage {
        position: relative;
      }
      canvas {
        display: block;
        height: 320px;
        border: 1px solid #334155;
      }
    </style>
  </head>
  <body>
    <p><a href="./index.html">Back to demos</a></p>
    <h1>Loading demo</h1>
    <form>
      <input
        name="url"
        type="url"
        aria-label="Audio URL"
        value="https://xeno-canto.org/995398/download"
      />
      <button type="submit">Load</button>
    </form>
    <audio
      controls
      crossorigin="anonymous"
      src="https://xeno-canto.org/995398/download"
    ></audio>
    <div class="stage"><canvas></canvas></div>
    <p data-status></p>

    <script type="module">
      import {
        attachCanvasNavigation,
        attachPlayheadOverlay,
        Sonoscope,
      } from "@sonoscope/core";

      const form = document.querySelector("form");
      const input = document.querySelector('input[name="url"]');
      const audio = document.querySelector("audio");
      const canvas = document.querySelector("canvas");

      let scope = await Sonoscope.fromAudio(audio, {
        followPlayback: "smooth",
      });

      let spectrogram = scope.createSpectrogram(canvas);
      let playhead = attachPlayheadOverlay(canvas.parentElement, scope);

      attachCanvasNavigation(spectrogram, canvas, {
        enableWheel: true,
        enableDrag: true,
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const url = input.value.trim();
        if (!url) return;
        audio.src = url;
        const nextScope = await Sonoscope.fromAudio(audio, { followPlayback: "page" });
        playhead?.destroy();
        scope.destroy();
        scope = nextScope;
        spectrogram = scope.createSpectrogram(canvas);
        playhead = attachPlayheadOverlay(canvas.parentElement, scope);
      });
    </script>
  </body>
</html>
