<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controls demo</title>
    <style>
      body {
        margin: 2rem;
        background: #10131a;
        color: #f8fafc;
        font-family: system-ui, sans-serif;
      }
      a {
        color: #93c5fd;
      }
      form,
      audio,
      canvas,
      .stage,
      .controls,
      .note {
        width: min(100%, 960px);
      }
      form,
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        margin-bottom: 1rem;
      }
      label {
        display: inline-flex;
        gap: 0.35rem;
        align-items: center;
        font-size: 0.875rem;
      }
      input[type="url"] {
        flex: 1;
        min-width: 16rem;
      }
      input[type="range"] {
        width: 100px;
        vertical-align: middle;
      }
      .val-badge {
        font-family: monospace;
        font-size: 0.8125rem;
        color: #93c5fd;
        min-width: 3.5rem;
      }
      audio {
        margin-bottom: 1rem;
      }
      .stage {
        position: relative;
        width: 100%;
      }
      canvas {
        display: block;
        width: 100%;
        height: 320px;
        border: 1px solid #334155;
      }
      .note {
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <p><a href="./index.html">Back to demos</a></p>
    <h1>STFT and visualization controls demo</h1>
    <form>
      <input name="url" type="url" aria-label="Audio URL" />
      <button type="submit">Load</button>
    </form>
    <div class="controls">
      <label
        >Window size
        <input
          name="windowSize"
          type="number"
          value="1024"
          min="128"
          step="128"
      /></label>
      <label
        >FFT size
        <input name="fftSize" type="number" value="1024" min="128" step="128"
      /></label>
      <label
        >Hop size
        <input name="hopSize" type="number" value="256" min="32" step="32"
      /></label>
      <label
        >Scale
        <select name="frequencyScale">
          <option>linear</option>
          <option>log</option>
          <option>mel</option>
        </select></label
      >
      <label
        >Mode
        <select name="mode">
          <option>db</option>
          <option>magnitude</option>
          <option>power</option>
        </select></label
      >
      <label
        >Min dB
        <input
          name="minDb"
          type="range"
          min="-140"
          max="0"
          value="-100"
          step="1"
        />
        <span class="val-badge" id="min-val-disp">-100 dB</span>
      </label>
      <label
        >Max dB
        <input
          name="maxDb"
          type="range"
          min="-100"
          max="20"
          value="0"
          step="1"
        />
        <span class="val-badge" id="max-val-disp">0 dB</span>
      </label>
      <label
        >Color
        <select name="colorMap">
          <optgroup label="Perceptually Uniform">
            <option>viridis</option>
            <option>magma</option>
            <option>inferno</option>
            <option>plasma</option>
            <option>cividis</option>
            <option>turbo</option>
          </optgroup>
          <optgroup label="Grayscale">
            <option value="gray">gray (dark background)</option>
            <option value="gray_r">gray_r (inverted / white background)</option>
            <option>Greys</option>
            <option>bone</option>
          </optgroup>
          <optgroup label="Sequential / Colorbrewer">
            <option>Purples</option>
            <option>Blues</option>
            <option>Greens</option>
            <option>Oranges</option>
            <option>Reds</option>
            <option>YlOrBr</option>
            <option>YlOrRd</option>
            <option>OrRd</option>
            <option>PuRd</option>
            <option>RdPu</option>
            <option>BuPu</option>
            <option>GnBu</option>
            <option>PuBu</option>
            <option>YlGnBu</option>
            <option>PuBuGn</option>
            <option>BuGn</option>
            <option>YlGn</option>
          </optgroup>
          <optgroup label="Miscellaneous / Fun">
            <option>ocean</option>
            <option>gist_earth</option>
            <option>terrain</option>
            <option>gist_stern</option>
            <option>gnuplot</option>
            <option>gnuplot2</option>
            <option>CMRmap</option>
            <option>cubehelix</option>
            <option>brg</option>
            <option>gist_rainbow</option>
            <option>rainbow</option>
            <option>jet</option>
            <option>nipy_spectral</option>
            <option>gist_ncar</option>
          </optgroup>
          <optgroup label="Categorical">
            <option>tab20</option>
          </optgroup>
        </select></label
      >
      <label
        >Shader
        <select name="shader">
          <option value="auto">auto</option>
          <option value="normal">normal</option>
          <option value="halftone">half-tone</option>
          <option value="terrain">terrain</option>
        </select></label
      >
      <button type="button" data-action="apply">Apply config</button>
      <span data-status></span>
    </div>
    <p class="note">
      Change STFT, intensity scaling, and display settings in real-time.
    </p>
    <audio controls crossorigin="anonymous"></audio>
    <div class="stage"><canvas></canvas></div>

    <script type="module">
      import "@sonoscope/halftone-spectrogram/auto";
      import {
        attachPlayheadOverlay,
        Sonoscope,
      } from "@sonoscope/core";

      const DEFAULT_AUDIO_URL =
        "https://upload.wikimedia.org/wikipedia/commons/0/01/After_You%27ve_Gone_%28Harris_1918_recording%29.wav?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original";
      const form = document.querySelector("form");
      const input = document.querySelector('input[name="url"]');
      const audio = document.querySelector("audio");
      let canvas = document.querySelector("canvas");
      const status = document.querySelector("[data-status]");
      const minSlider = document.querySelector('input[name="minDb"]');
      const maxSlider = document.querySelector('input[name="maxDb"]');
      const minDisp = document.getElementById("min-val-disp");
      const maxDisp = document.getElementById("max-val-disp");
      const modeSelect = document.querySelector('select[name="mode"]');
      const colorSelect = document.querySelector('select[name="colorMap"]');

      let scope;
      let viewer;
      let source;
      let cleanupNavigation;
      let cleanupPlayhead;

      function value(name) {
        return document.querySelector(`[name="${name}"]`).value;
      }

      function updateRangeLabels() {
        const minVal = Number(minSlider.value);
        const maxVal = Number(maxSlider.value);
        minDisp.textContent = `${minVal} dB`;
        maxDisp.textContent = `${maxVal} dB`;
      }

      modeSelect.addEventListener("change", () => {
        if (viewer) {
          viewer.updateConfig({
            valueMode: modeSelect.value,
            minDb: Number(minSlider.value),
            maxDb: Number(maxSlider.value),
          });
        }
      });

      minSlider.addEventListener("input", () => {
        updateRangeLabels();
        if (viewer) {
          viewer.updateConfig({
            minDb: Number(minSlider.value),
          });
        }
      });

      maxSlider.addEventListener("input", () => {
        updateRangeLabels();
        if (viewer) {
          viewer.updateConfig({
            maxDb: Number(maxSlider.value),
          });
        }
      });

      colorSelect.addEventListener("change", () => {
        if (viewer) {
          viewer.updateConfig({
            colorMap: colorSelect.value,
          });
        }
      });

      function config() {
        return {
          windowSize: Number(value("windowSize")),
          fftSize: Number(value("fftSize")),
          hopSize: Number(value("hopSize")),
          window: "hann",
          minFrequency: 0,
          ...(source ? { maxFrequency: source.sampleRate / 2 } : {}),
          frequencyScale: value("frequencyScale"),
          valueMode: value("mode"),
          minDb: Number(minSlider.value),
          maxDb: Number(maxSlider.value),
          valueGamma: 1,
          clampValues: true,
          colorMap: value("colorMap"),
          renderer: rendererConfig(),
        };
      }

      function rendererConfig() {
        const shader = value("shader");
        return shader === "auto" ? "auto" : { type: "webgl", program: shader };
      }

      function statusText() {
        const viewport = viewer.getViewport();
        return `${viewport.startTime.toFixed(2)}s-${viewport.endTime.toFixed(2)}s, ${Math.round(viewport.maxFrequency)}Hz ceiling`;
      }

      async function load(url) {
        cleanupNavigation?.();
        cleanupPlayhead?.destroy?.();
        viewer?.destroy();
        scope?.destroy();
        canvas = resetCanvas(canvas);
        audio.src = url;
        status.textContent = "Loading and rendering...";
        try {
          scope = await Sonoscope.fromAudio(audio, {
            followPlayback: "page",
          });
          viewer = scope.createSpectrogram(canvas, {
            ...config(),
          });
          source = scope.source;
          status.textContent = statusText();
          cleanupNavigation = scope.attachNavigation(canvas);
          cleanupPlayhead = attachPlayheadOverlay(canvas.parentElement, scope);
        } catch (error) {
          status.textContent =
            error instanceof Error ? error.message : String(error);
        }
      }

      function resetCanvas(current) {
        const next = current.cloneNode(false);
        current.replaceWith(next);
        return next;
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        if (input.value.trim()) void load(input.value.trim());
      });

      document
        .querySelector('[data-action="apply"]')
        .addEventListener("click", () => {
          if (!viewer) return;
          const previousRenderer = JSON.stringify(viewer.getConfig().renderer);
          const nextConfig = config();
          if (JSON.stringify(nextConfig.renderer) !== previousRenderer) {
            const url =
              viewer.getConfig().audio?.currentSrc || input.value.trim();
            if (url) void load(url);
            return;
          }
          viewer.updateConfig(nextConfig);
          status.textContent = statusText();
        });

      input.value =
        new URLSearchParams(window.location.search).get("url") ||
        DEFAULT_AUDIO_URL;
      await load(input.value);
    </script>
  </body>
</html>
