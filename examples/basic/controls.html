<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controls demo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <p><a href="./index.html">Back to demos</a></p>
    <h1>STFT and visualization controls demo</h1>
    <form>
      <input name="url" type="url" aria-label="Audio URL" />
      <button type="submit">Load</button>
    </form>
    <div class="controls">
      <label>Window size <input name="windowSize" type="number" value="1024" min="128" step="128" /></label>
      <label>FFT size <input name="fftSize" type="number" value="1024" min="128" step="128" /></label>
      <label>Hop size <input name="hopSize" type="number" value="256" min="32" step="32" /></label>
      <label>Window <select name="window"><option>hann</option><option>hamming</option><option>blackman</option><option>rectangular</option></select></label>
      <label>Frequency scale <select name="frequencyScale"><option>linear</option><option>log</option><option>mel</option></select></label>
      <label>Value mode <select name="mode"><option>db</option><option>magnitude</option><option>power</option></select></label>
      <label>Min <input name="min" type="number" value="-100" step="1" /></label>
      <label>Max <input name="max" type="number" value="0" step="1" /></label>
      <label>Gamma <input name="gamma" type="number" value="1" min="0.1" max="4" step="0.1" /></label>
      <label>Color <select name="colorMap"><option>viridis</option><option>gray</option><option>magma</option><option>inferno</option><option>plasma</option><option>turbo</option></select></label>
      <button type="button" data-action="apply">Apply config</button>
      <span data-status></span>
    </div>
    <audio controls crossorigin="anonymous"></audio>
    <div class="stage"><canvas></canvas></div>
    <script type="module" src="./controls.ts"></script>
  </body>
</html>
