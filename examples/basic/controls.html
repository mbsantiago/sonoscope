<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controls demo</title>
    <style>
      body { margin: 2rem; background: #10131a; color: #f8fafc; font-family: system-ui, sans-serif; }
      a { color: #93c5fd; }
      form, audio, canvas, .stage, .controls, .note { width: min(100%, 960px); }
      form, .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 1rem; }
      label { display: inline-flex; gap: 0.25rem; align-items: center; }
      input[type='url'] { flex: 1; min-width: 16rem; }
      audio { margin-bottom: 1rem; }
      canvas { display: block; height: 320px; border: 1px solid #334155; }
      .note { color: #cbd5e1; }
    </style>
  </head>
  <body>
    <p><a href="./index.html">Back to demos</a></p>
    <h1>STFT and visualization controls demo</h1>
    <form>
      <input name="url" type="url" aria-label="Audio URL" />
      <button type="submit">Load</button>
    </form>
    <div class="controls">
      <label>Window size <input name="windowSize" type="number" value="1024" min="128" step="128" /></label>
      <label>FFT size <input name="fftSize" type="number" value="1024" min="128" step="128" /></label>
      <label>Hop size <input name="hopSize" type="number" value="256" min="32" step="32" /></label>
      <label>Scale <select name="frequencyScale"><option>linear</option><option>log</option><option>mel</option></select></label>
      <label>Mode <select name="mode"><option>db</option><option>magnitude</option><option>power</option></select></label>
      <label>Color <select name="colorMap"><option>viridis</option><option>gray</option><option>magma</option><option>inferno</option><option>plasma</option><option>turbo</option></select></label>
      <button type="button" data-action="apply">Apply config</button>
      <span data-status></span>
    </div>
    <p class="note">Change STFT and display settings, then apply them to rerender the current source.</p>
    <audio controls crossorigin="anonymous"></audio>
    <div class="stage"><canvas></canvas></div>

    <script type="module">
      import { SpectrogramViewer, WorkerComputeBackend, createAudioSourceFromUrl } from '../../src';

      const DEFAULT_AUDIO_URL = 'https://xeno-canto.org/995398/download';
      const form = document.querySelector('form');
      const input = document.querySelector('input[name="url"]');
      const audio = document.querySelector('audio');
      const canvas = document.querySelector('canvas');
      const status = document.querySelector('[data-status]');
      let viewer;
      let source;

      function value(name) {
        return document.querySelector(`[name="${name}"]`).value;
      }

      function config() {
        return {
          stft: { windowSize: Number(value('windowSize')), fftSize: Number(value('fftSize')), hopSize: Number(value('hopSize')), window: 'hann' },
          viewport: { minFrequency: 0, maxFrequency: source.sampleRate / 2, frequencyScale: value('frequencyScale') },
          valueScale: { mode: value('mode'), min: -100, max: 0, gamma: 1, clamp: true },
          colorMap: value('colorMap'),
        };
      }

      function statusText() {
        const viewport = viewer.getViewport();
        return `${viewport.startTime.toFixed(2)}s-${viewport.endTime.toFixed(2)}s, ${Math.round(viewport.maxFrequency)}Hz ceiling`;
      }

      async function load(url) {
        viewer?.destroy();
        audio.src = url;
        status.textContent = 'Loading and rendering...';
        SpectrogramViewer.renderLoading(canvas, 'Decoding audio...');
        source = await createAudioSourceFromUrl(url);
        viewer = await SpectrogramViewer.create({
          audio,
          canvas,
          source,
          backend: new WorkerComputeBackend(),
          ...config(),
          viewport: { ...config().viewport, startTime: 0, endTime: Math.min(10, source.duration) },
        });
        await viewer.render();
        status.textContent = statusText();
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        if (input.value.trim()) void load(input.value.trim());
      });
      document.querySelector('[data-action="apply"]').addEventListener('click', () => {
        if (!viewer) return;
        viewer.setConfig(config());
        viewer.requestRender();
        status.textContent = statusText();
      });

      input.value = new URLSearchParams(window.location.search).get('url') || DEFAULT_AUDIO_URL;
      await load(input.value);
    </script>
  </body>
</html>
