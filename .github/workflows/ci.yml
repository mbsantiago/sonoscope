name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-checks:
    name: Quick Checks (Biome & TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check Formatting & Lints (Biome)
        run: npm run check:biome

      - name: Check TypeScript Types
        run: npm run check:types

  rust-wasm:
    name: Rust & WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm/stft

      - name: Run Rust tests
        run: cargo test --manifest-path wasm/stft/Cargo.toml

      - name: Build WASM Binary
        run: node scripts/build-wasm.mjs

  js-tests:
    name: Unit & Browser Tests
    needs: [quick-checks, rust-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Install playwright browsers
        run: npx playwright install --with-deps

      - name: Run Browser / WebGL Tests
        run: npm run test:browser

  python-tests:
    name: Python Anywidget Tests (${{ matrix.python-version }})
    needs: [quick-checks, rust-wasm]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install JS dependencies & build packages
        run: |
          npm ci
          npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run pytest
        working-directory: packages/anywidget
        run: |
          uv run --python ${{ matrix.python-version }} --extra dev pytest tests

  build-verification:
    name: Monorepo Build & Package Smoke Test
    needs: [quick-checks, js-tests, python-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: npm ci

      - name: Build All Monorepo Packages
        run: npm run build

      - name: Build Documentation (Starlight)
        run: npm run build:docs

      - name: Build Examples
        run: npm run build:examples

      - name: Build Python Distribution (Wheel & SDist)
        working-directory: packages/anywidget
        run: uv build
