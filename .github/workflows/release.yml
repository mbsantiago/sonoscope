name: Release & Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-gate:
    name: CI Test Gate
    uses: ./.github/workflows/ci.yml
    with:
      cache: false
    permissions:
      contents: read

  build:
    name: Build Release Artifacts
    needs: test-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest-known"
          enable-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build Monorepo Packages
        run: npm run build

      - name: Pack NPM Packages
        run: |
          mkdir -p release/npm
          npm pack --workspace=@sonoscope/core --workspace=@sonoscope/react --workspace=@sonoscope/ascii-spectrogram --workspace=@sonoscope/halftone-spectrogram --workspace=@sonoscope/terrain-spectrogram --workspace=@sonoscope/topographic-spectrogram --pack-destination release/npm

      - name: Build Python Package
        working-directory: packages/anywidget
        run: uv build

      - name: Upload NPM Packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-packages
          path: release/npm/*.tgz
          if-no-files-found: error

      - name: Upload Python Package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package
          path: packages/anywidget/dist/*
          if-no-files-found: error

  publish-npm:
    name: Publish NPM Packages
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download NPM Packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-packages
          path: npm-packages

      - name: Publish NPM Packages
        run: |
          for package in npm-packages/*.tgz; do
            npm publish "$package"
          done

  publish-pypi:
    name: Publish Python Package
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download Python Package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true

  create-release:
    name: Create GitHub Release
    needs: [publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download Python Package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package
          path: dist

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
